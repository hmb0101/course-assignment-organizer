<div class="field{% if field.errors %} has-error{% endif %}{% if pending %} has-pending-review{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}{% if pending %}<span class="field-pending">待确认</span>{% endif %}</label>{{ field }}{% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div>
